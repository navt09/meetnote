name: checks

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: only the tip matters.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These four are the gate. They need no secrets: every page is dynamic
      # and reads Supabase inside a try, so a build with no environment still
      # compiles. Keep it that way, or this workflow starts needing keys.
      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
